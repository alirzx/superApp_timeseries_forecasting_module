name: superapp-time-series-forecasting
services:
  # One-shot setup profile; not part of the always-on services.
  model-setup:
    profiles: ["setup"]
    build:
      context: .
      dockerfile: backend/Dockerfile.model-setup
      args:
        PIP_PRIMARY_INDEX_URL: ${PIP_PRIMARY_INDEX_URL:-https://package-mirror.liara.ir/repository/pypi/simple}
        PIP_FALLBACK_INDEX_URL: ${PIP_FALLBACK_INDEX_URL:-https://mirror2.chabokan.net/pypi/simple/}
    env_file: .env
    volumes:
      - ./.models/granite-ttm-r3:/models/granite-ttm-r3:rw
    restart: "no"
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        PIP_PRIMARY_INDEX_URL: ${PIP_PRIMARY_INDEX_URL:-https://package-mirror.liara.ir/repository/pypi/simple}
        PIP_FALLBACK_INDEX_URL: ${PIP_FALLBACK_INDEX_URL:-https://mirror2.chabokan.net/pypi/simple/}
        TORCH_CPU_INDEX_URL: ${TORCH_CPU_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    env_file: .env
    environment:
      MODEL_PATH: /models/granite-ttm-r3
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      OMP_NUM_THREADS: "${CPU_THREADS:-2}"
      MKL_NUM_THREADS: "${CPU_THREADS:-2}"
      OPENBLAS_NUM_THREADS: "${CPU_THREADS:-2}"
    volumes:
      - ./.models/granite-ttm-r3:/models/granite-ttm-r3:ro
    ports:
      - "${API_BIND_IP:-127.0.0.1}:${API_PORT:-8005}:8000"
    cpus: ${API_CPUS:-2.0}
    mem_limit: ${API_MEMORY:-2g}
    pids_limit: 128
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  ui:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      API_TOKEN: ${API_TOKEN:?Set API_TOKEN in .env}
    ports:
      # 0.0.0.0 or specific LAN address in server .env enables LAN access.
      - "${UI_BIND_IP:-127.0.0.1}:${UI_PORT:-8086}:8080"
    cpus: ${UI_CPUS:-0.5}
    mem_limit: ${UI_MEMORY:-256m}
    pids_limit: 64
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,size=16m", "/var/cache/nginx:rw,nosuid,size=16m", "/var/run:rw,nosuid,size=4m"]
    # Serve static UI even when API fails to start; proxy returns 502 until ready.
    # Runtime DNS lookup in Nginx resolves api when it becomes available.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
